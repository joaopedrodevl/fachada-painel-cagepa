spring:
  application:
    name: Fachada Cagepa Test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    database: h2
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: never

app:
  cli:
    enabled: false
  jwt:
    secret: test-secret-key-for-testing-only-12345678901234567890
    expiration-ms: 3600000

logging:
  level:
    root: INFO
    com.fachada.cagepa: DEBUG
    org.springframework: WARN
    org.hibernate: OFF

