spring.application.name=Fachada Cagepa

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Para evitar erro de timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Caminho do Tesseract (ajuste conforme seu sistema)
tessdata.path=/usr/share/tesseract-ocr/5/tessdata

app.jwt.secret=${JWT_SECRET:defaultSecretKey}
app.jwt.expiration-ms=86400000