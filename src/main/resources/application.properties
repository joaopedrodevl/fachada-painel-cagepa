spring.application.name=Fachada Cagepa

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Para evitar erro de timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Caminho do Tesseract (ajuste conforme seu sistema)
tessdata.path=/usr/share/tesseract-ocr/5/tessdata

app.jwt.secret=${JWT_SECRET:defaultSecretKey}
app.jwt.expiration-ms=86400000

# Configuracoes de Logging
logging.level.root=INFO
logging.level.com.fachada.cagepa.fachadacagepa=INFO
logging.level.AUDITORIA=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.file.name=logs/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Configuracoes do Resend para envio de emails
resend.api.key=${RESEND_API_KEY:seu_api_key_aqui}
resend.email.from=${RESEND_EMAIL_REMETENTE:noreply@rimesk.com.br}

# Configuracoes de notificacao
notificacao.limiar.percentual=70
notificacao.ativa=true
